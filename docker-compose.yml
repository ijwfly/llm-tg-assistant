services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      # WORK_ROOT and CLAUDE_HOME are mounted at their host paths, so the cwd of every
      # `claude` process (and therefore the transcript folder) is the same as in a terminal.
      WORK_ROOT: ${WORK_ROOT:?set WORK_ROOT in .env}
      CLAUDE_CONFIG_DIR: ${CLAUDE_HOME:?set CLAUDE_HOME in .env}
      BRIDGE_SOCKET: /data/bridge.sock
    volumes:
      - ${WORK_ROOT:?set WORK_ROOT in .env}:${WORK_ROOT}
      - ${CLAUDE_HOME:?set CLAUDE_HOME in .env}:${CLAUDE_HOME}
      - ${GITCONFIG:-~/.gitconfig}:/home/app/.gitconfig:ro
      - ./settings_local.py:/app/settings_local.py:ro
      - inbox:/data/inbox

volumes:
  pgdata:
  inbox:

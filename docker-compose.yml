services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      WORK_ROOT: /work
      CLAUDE_CONFIG_DIR: /home/app/.claude
    volumes:
      - ${WORK_ROOT:-./work}:/work
      - ${CLAUDE_HOME:-~/.claude}:/home/app/.claude
      - ${GITCONFIG:-~/.gitconfig}:/home/app/.gitconfig:ro
      - ./settings_local.py:/app/settings_local.py:ro
      - inbox:/data/inbox

volumes:
  pgdata:
  inbox:
